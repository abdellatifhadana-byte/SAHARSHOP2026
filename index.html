<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SAHAR shop — AI Commerce OS</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/sahar-logo-text.png" type="image/png" />
    <link rel="apple-touch-icon" href="/sahar-logo-text.png" />
    <meta name="description" content="SAHAR shop — نظام تشغيل التجارة الإلكترونية بالذكاء الاصطناعي للسوق المغربي" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SAHAR shop" />
    <meta property="og:title" content="SAHAR shop — AI Commerce OS" />
    <meta property="og:image" content="/sahar-banner-wide.png" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { 
        background: #0A0A0F; 
        font-family: 'Tajawal', 'IBM Plex Sans Arabic', system-ui, sans-serif;
        overflow: hidden;
      }
      #root { min-height: 100dvh; }

      #splash {
        position: fixed; inset: 0; background: #0A0A0F; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1), visibility 0.5s;
      }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

      #splash-bg {
        position: absolute; inset: 0;
        background-image: url('/sahar-banner-mobile.png');
        background-size: cover; background-position: center;
        opacity: .08; filter: blur(4px); transform: scale(1.05);
      }

      #splash-ambient {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 70% 40% at 50% 30%, rgba(124,58,237,0.12) 0%, transparent 60%),
          radial-gradient(ellipse 50% 30% at 50% 70%, rgba(255,106,0,0.08) 0%, transparent 50%);
        animation: ambientBreathe 4s ease-in-out infinite;
      }

      @keyframes ambientBreathe {
        0%,100% { opacity: 0.7; } 50% { opacity: 1; }
      }

      #splash-content {
        position: relative; z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 0;
        animation: splashIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
      }

      @keyframes splashIn {
        from { opacity: 0; transform: translateY(20px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      #splash-logo-wrap {
        width: 120px; height: 120px; border-radius: 28px; overflow: hidden;
        background: rgba(10,10,15,0.9);
        box-shadow: 0 0 0 1px rgba(255,106,0,0.3), 0 20px 60px rgba(255,106,0,0.2), 0 4px 20px rgba(0,0,0,0.6);
        margin-bottom: 24px;
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }

      #splash-logo-wrap::before {
        content: '';
        position: absolute; inset: -3px; border-radius: 31px;
        border: 1.5px solid transparent;
        border-top-color: rgba(255,106,0,0.5);
        border-right-color: rgba(124,58,237,0.4);
        animation: ringSpin 3s linear infinite;
      }

      @keyframes ringSpin { to { transform: rotate(360deg); } }

      #splash-logo { width: 85%; height: 85%; object-fit: contain; }
      #splash-logo-fallback {
        font-size: 56px; font-weight: 900;
        background: linear-gradient(135deg, #FF6A00, #FFB347);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        display: none;
      }

      #splash-title {
        font-size: 34px; font-weight: 900; color: #FAFAFA;
        letter-spacing: -0.03em; margin-bottom: 4px;
        direction: ltr;
      }
      #splash-title span {
        color: #FF6A00; text-shadow: 0 0 30px rgba(255,106,0,0.5);
      }

      #splash-sub {
        font-size: 11px; color: rgba(255,255,255,0.3);
        letter-spacing: 0.15em; text-transform: uppercase;
        margin-bottom: 32px; font-weight: 600;
      }

      #splash-dots { display: flex; gap: 8px; align-items: center; }
      .splash-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: rgba(255,106,0,0.4);
        animation: dotPulse 1.2s ease infinite;
      }
      .splash-dot:nth-child(2) { animation-delay: 0.2s; }
      .splash-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes dotPulse {
        0%,100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.1); background: #FF6A00; }
      }

      #splash-zellige {
        position: absolute; top: 0; left: 0; right: 0;
        height: 40px; overflow: hidden; opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-bg"></div>
      <div id="splash-ambient"></div>

      <svg id="splash-zellige" viewBox="0 0 800 40" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

      <div id="splash-content">
        <div id="splash-logo-wrap">
          <img id="splash-logo" src="/sahar-logo-text.png" alt="SAHAR shop"
            onerror="this.style.display='none';document.getElementById('splash-logo-fallback').style.display='block'"/>
          <div id="splash-logo-fallback">S</div>
        </div>
        <div id="splash-title"><span>SAHAR</span> shop</div>
        <div id="splash-sub">AI Commerce OS</div>
        <div id="splash-dots">
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var svg = document.getElementById('splash-zellige');
        if (!svg) return;
        var colors = ['#FF6A00','#C9954C','#7C3AED'];
        for (var i = 0; i < 40; i++) {
          var p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          var x = i * 22 - 11;
          p.setAttribute('points', x+',0 '+(x+11)+',11 '+x+',22 '+(x-11)+',11');
          p.setAttribute('fill', colors[i % 3]);
          p.setAttribute('opacity', '0.5');
          svg.appendChild(p);
        }
      });
      window.hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(function() { s.remove(); }, 600); }
      };
      setTimeout(window.hideSplash, 3500);
    </script>
  </body>
</html>
