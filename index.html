<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SAHAR shop — AI Commerce OS</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/sahar-logo-text.png" type="image/png" />
    <link rel="apple-touch-icon" href="/sahar-logo-text.png" />
    <meta name="description" content="SAHAR shop — نظام تشغيل التجارة الإلكترونية بالذكاء الاصطناعي للسوق المغربي" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SAHAR shop" />
    <meta property="og:title" content="SAHAR shop — AI Commerce OS" />
    <meta property="og:image" content="/sahar-banner-wide.png" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { 
        background: #050505; 
        font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      #root { min-height: 100dvh; }

      /* ── SPLASH SCREEN — Luxury Minimal ── */
      #splash {
        position: fixed; inset: 0; background: #050505;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                    visibility 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash.hidden { 
        opacity: 0; visibility: hidden; pointer-events: none; 
      }

      /* Ambient glow */
      #splash-ambient {
        position: absolute; inset: 0;
        background: 
          radial-gradient(ellipse 80% 50% at 50% 40%, rgba(124,58,237,0.08) 0%, transparent 60%),
          radial-gradient(ellipse 60% 40% at 50% 60%, rgba(255,122,0,0.05) 0%, transparent 50%);
        animation: ambientBreathe 4s ease-in-out infinite;
      }

      @keyframes ambientBreathe {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }

      #splash-content {
        position: relative; z-index: 1;
        display: flex; flex-direction: column;
        align-items: center; gap: 0;
        animation: splashReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes splashReveal {
        from { opacity: 0; transform: translateY(24px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Logo ring */
      #splash-logo-ring {
        width: 100px; height: 100px; border-radius: 50%;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 28px;
        position: relative;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 20px 60px rgba(0,0,0,0.4);
      }

      #splash-logo-ring::before {
        content: '';
        position: absolute; inset: -3px; border-radius: 50%;
        border: 1.5px solid transparent;
        border-top-color: rgba(124,58,237,0.4);
        border-right-color: rgba(255,122,0,0.3);
        animation: ringSpin 3s linear infinite;
      }

      @keyframes ringSpin {
        to { transform: rotate(360deg); }
      }

      #splash-logo {
        width: 64px; height: 64px; object-fit: contain;
        filter: brightness(1.1);
      }

      #splash-logo-fallback {
        font-size: 42px; font-weight: 900; 
        background: linear-gradient(135deg, #7C3AED, #FF7A00);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        display: none;
      }

      /* Title */
      #splash-title {
        font-size: 28px; font-weight: 800; color: #FAFAFA;
        letter-spacing: -0.03em; margin-bottom: 6px;
      }

      #splash-brand {
        background: linear-gradient(135deg, #A855F7, #FF7A00);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }

      #splash-sub {
        font-size: 10px; color: rgba(255,255,255,0.3);
        letter-spacing: 0.2em; text-transform: uppercase;
        margin-bottom: 36px; font-weight: 600;
      }

      /* Progress bar */
      #splash-progress {
        width: 120px; height: 2px; background: rgba(255,255,255,0.06);
        border-radius: 1px; overflow: hidden;
      }

      #splash-progress-fill {
        width: 0%; height: 100%; border-radius: 1px;
        background: linear-gradient(90deg, #7C3AED, #A855F7, #FF7A00);
        animation: progressGrow 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes progressGrow {
        from { width: 0%; }
        to { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- SPLASH SCREEN -->
    <div id="splash">
      <div id="splash-ambient"></div>
      <div id="splash-content">
        <div id="splash-logo-ring">
          <img id="splash-logo" src="/sahar-logo-text.png" alt="SAHAR shop"
            onerror="this.style.display='none';document.getElementById('splash-logo-fallback').style.display='block'"/>
          <div id="splash-logo-fallback">S</div>
        </div>
        <div id="splash-title"><span id="splash-brand">SAHAR</span> shop</div>
        <div id="splash-sub">AI Commerce OS</div>
        <div id="splash-progress">
          <div id="splash-progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.hideSplash = function() {
        const s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 600); }
      };
      setTimeout(window.hideSplash, 3500);
    </script>
  </body>
</html>
