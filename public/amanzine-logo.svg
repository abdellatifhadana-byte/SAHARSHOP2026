<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Dégradés pour l'effet 3D et les ombres -->
    <linearGradient id="greenOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5226" />
      <stop offset="30%" stop-color="#167a36" />
      <stop offset="70%" stop-color="#1e9e48" />
      <stop offset="100%" stop-color="#0b4b1e" />
    </linearGradient>
    
    <linearGradient id="greenInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a421c" />
      <stop offset="100%" stop-color="#10662d" />
    </linearGradient>

    <linearGradient id="redBannerTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d61a1a" />
      <stop offset="50%" stop-color="#f23535" />
      <stop offset="100%" stop-color="#b80f0f" />
    </linearGradient>

    <linearGradient id="redBannerBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b80f0f" />
      <stop offset="50%" stop-color="#e62727" />
      <stop offset="100%" stop-color="#8a0808" />
    </linearGradient>

    <linearGradient id="redBannerDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a0808" />
      <stop offset="100%" stop-color="#590404" />
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a8a3a" />
      <stop offset="100%" stop-color="#09421c" />
    </linearGradient>

    <!-- Filtres pour les ombres -->
    <filter id="shadowRight" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(300, 250)">
    
    <!-- 1. Arche Verte (Structure globale avec ombre) -->
    <g filter="url(#shadowRight)">
      <!-- Couche externe (Arrondie) -->
      <path d="M 0 -175
               C 90 -175, 165 -80, 180 30
               C 190 100, 180 165, 165 215
               C 150 195, 135 165, 125 140
               C 135 90, 140 35, 130 -10
               C 110 -65, 60 -95, 0 -95
               C -60 -95, -110 -65, -130 -10
               C -140 35, -135 90, -125 140
               C -135 165, -150 195, -165 215
               C -180 165, -190 100, -180 30
               C -165 -80, -90 -175, 0 -175 Z"
            fill="url(#greenOuter)" />
            
      <!-- Couche intérieure (Pour donner du volume à l'épaisseur) -->
      <path d="M -125 140
               C -135 165, -150 195, -165 215
               L -145 215
               C -130 195, -115 160, -105 140 Z" 
            fill="url(#greenInner)" />
      <path d="M 125 140
               C 135 165, 150 195, 165 215
               L 145 215
               C 130 195, 115 160, 105 140 Z" 
            fill="url(#greenInner)" />
    </g>

    <!-- 2. Étoile à 8 branches (Rub El Hizb) -->
    <g transform="translate(0, -60)" filter="url(#shadowLight)">
      <!-- Base carrée -->
      <rect x="-28" y="-28" width="56" height="56" fill="url(#starGrad)" />
      <!-- Pointe Nord -->
      <polygon points="0,-55 12,-28 -12,-28" fill="url(#starGrad)" />
      <!-- Pointe Sud -->
      <polygon points="0,55 12,28 -12,28" fill="url(#starGrad)" />
      <!-- Pointe Est -->
      <polygon points="55,0 28,12 28,-12" fill="url(#starGrad)" />
      <!-- Pointe Ouest -->
      <polygon points="-55,0 -28,12 -28,-12" fill="url(#starGrad)" />
    </g>

    <!-- 3. Ruban Rouge en Z (Structure principale) -->
    <g filter="url(#shadowRight)">
      <!-- Partie supérieure gauche -->
      <path d="M -175 65
               C -145 40, -90 25, -40 30
               C 10 35, 35 55, 75 45
               C 100 38, 120 30, 140 25
               L 135 65
               C 105 70, 80 80, 55 80
               C 15 80, -10 50, -45 55
               C -90 60, -135 75, -165 100 Z"
            fill="url(#redBannerTop)" />

      <!-- Bande diagonale centrale (Le Z) -->
      <path d="M 135 65
               C 140 90, 95 125, 25 170
               C -45 215, -115 240, -155 250
               L -165 215
               C -125 205, -60 175, 0 140
               C 60 105, 100 75, 120 55 Z"
            fill="url(#redBannerBottom)" />

      <!-- Queue inférieure droite -->
      <path d="M -155 250
               C -70 255, 60 240, 150 195
               L 165 235
               C 80 275, -40 285, -145 285 Z"
            fill="url(#redBannerDark)" />
    </g>

    <!-- 4. Détails de lumière et d'ombre (Reflets pour le réalisme) -->
    <!-- Reflet clair sur le haut du ruban rouge -->
    <path d="M 130 65 C 100 70, 80 75, 55 80 C 75 75, 105 65, 135 60 Z" fill="rgba(255,255,255,0.4)" />
    
    <!-- Ombre sous le ruban rouge à l'intérieur de l'arche -->
    <path d="M -45 55 C -10 50, 15 80, 55 80 C 20 85, -10 60, -40 60 Z" fill="rgba(0,0,0,0.3)" />

    <!-- Ombre intérieure de l'arche (côté gauche) -->
    <path d="M -130 -10 C -140 35, -135 90, -125 140 C -115 165, -125 120, -120 40 Z" fill="rgba(0,0,0,0.2)" />
    
    <!-- Ombre intérieure de l'arche (côté droit) -->
    <path d="M 130 -10 C 140 35, 135 90, 125 140 C 115 165, 125 120, 120 40 Z" fill="rgba(0,0,0,0.2)" />
  </g>
</svg>
